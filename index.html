<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Panel Escolar Greenland</title>
<meta name="robots" content="noindex, nofollow">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    font-family:-apple-system,'Segoe UI',Arial,sans-serif;
    background:#1C1917;
    overflow:hidden;
  }
  #loading {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px;
    background:#1C1917; color:#D4A853; z-index:2;
    transition:opacity .3s ease;
  }
  #loading.hide { opacity:0; pointer-events:none; }
  #loading .logo {
    font-family:Georgia,'Times New Roman',serif; font-style:italic;
    font-size:22px; color:#D4A853;
  }
  #loading .sub { font-size:12px; color:#A8A29E; letter-spacing:.4px; }
  .spinner {
    width:26px; height:26px; border-radius:50%;
    border:2.5px solid #3a3632; border-top-color:#D4A853;
    animation:spin .8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  iframe {
    position:fixed; inset:0; width:100%; height:100%;
    border:none; display:block;
  }
</style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <div class="logo">Panel Escolar</div>
    <div class="sub">Cargando...</div>
  </div>

  <iframe
    id="marco"
    src="https://script.google.com/macros/s/AKfycbzioxBW8vF517Xwm14nobaotPygrCudiKPgkPXW07C6rPYceWtHgt43UleRvDvCTYXDkw/exec"
    allow="clipboard-write; clipboard-read"
    title="Panel Escolar Greenland">
  </iframe>

  <script>
    var marco = document.getElementById('marco');
    var loading = document.getElementById('loading');
    marco.addEventListener('load', function () {
      loading.classList.add('hide');
      setTimeout(function () { loading.style.display = 'none'; }, 350);
    });
    // Si por algun motivo el iframe tarda demasiado o no dispara 'load'
    // (bloqueo del navegador, red lenta), quitar el loader igual tras 8s
    // para no dejar a la persona mirando un spinner para siempre.
    setTimeout(function () {
      loading.classList.add('hide');
      setTimeout(function () { loading.style.display = 'none'; }, 350);
    }, 8000);
  </script>

</body>
</html>
