<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="theme-color" content="#1C1917">
<meta name="mobile-web-app-capable" content="yes">
<title>Panel Escolar</title>
<meta name="robots" content="noindex, nofollow">
<!-- Solucion al 404 de favicon -->
<link rel="icon" href="data:,">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:#1C1917;
    color:#fff;
    overflow:hidden;
  }

  /* Pantalla de configuracion (primera vez en este navegador) */
  #config {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:24px; z-index:3;
  }
  .logo {
    font-family:Georgia,'Times New Roman',serif; font-style:italic;
    font-weight:300; font-size:24px; margin-bottom:6px; text-align:center;
  }
  .logo em { font-style:italic; color:#D4A853; }
  .caja {
    background:#252220; border-radius:16px; padding:28px 26px;
    max-width:360px; width:100%; margin-top:20px;
    box-shadow:0 8px 32px rgba(0,0,0,.4);
  }
  .caja p {
    font-size:12px; color:#A8A29E; line-height:1.6; margin-bottom:16px;
  }
  #inputUrl {
    width:100%; padding:13px; border-radius:10px; border:1.5px solid #3a3632;
    background:#1C1917; color:#fff; font-size:13px; margin-bottom:12px;
    font-family:'DM Mono',monospace;
  }
  #inputUrl:focus { outline:none; border-color:#D4A853; }
  #btnGuardar {
    width:100%; padding:13px; border:none; border-radius:10px;
    background:#D4A853; color:#1C1917; font-weight:700; font-size:14px; cursor:pointer;
  }
  #btnGuardar:active { opacity:.85; }
  .errorCfg { color:#E8614A; font-size:12px; text-align:center; min-height:16px; margin-top:10px; }
  #btnOlvidar {
    display:block; margin:18px auto 0; background:none; border:none;
    color:#6b6560; font-size:11px; cursor:pointer; text-decoration:underline;
  }

  /* Loader mientras carga el iframe */
  #loading {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px;
    background:#1C1917; z-index:2; transition:opacity .3s ease;
  }
  #loading.hide { opacity:0; pointer-events:none; }
  #loading .sub { font-size:12px; color:#A8A29E; letter-spacing:.4px; }
  .spinner {
    width:26px; height:26px; border-radius:50%;
    border:2.5px solid #3a3632; border-top-color:#D4A853;
    animation:spin .8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  iframe {
    position:fixed; inset:0; width:100%; height:100%;
    border:none; display:none; z-index:1;
  }
  #btnSalir {
    position:fixed; bottom:14px; right:14px; z-index:4;
    background:rgba(37,34,32,.92); color:#A8A29E; border:1px solid #3a3632;
    border-radius:20px; padding:7px 14px; font-size:11px; cursor:pointer;
    display:none; backdrop-filter:blur(4px);
  }
  #btnSalir:active { opacity:.7; }
</style>
</head>
<body>

  <!-- Pantalla de configuracion: solo aparece si este navegador no tiene nada guardado -->
  <div id="config" style="display:none">
    <div class="logo">Panel <em>Escolar</em></div>
    <div class="caja">
      <p>
        Ingresa tus dos datos de acceso (llegan por correo). Esta pagina
        NUNCA los guarda ni transmite a ningun servidor propio — solo
        quedan en la memoria de ESTE navegador, en este dispositivo.
      </p>
      <label style="display:block;font-size:11px;color:#A8A29E;margin-bottom:6px;text-align:left">ID de implementacion</label>
      <input type="text" id="inputId" placeholder="AKfycb..." autocomplete="off" spellcheck="false" style="margin-bottom:14px">
      <label style="display:block;font-size:11px;color:#A8A29E;margin-bottom:6px;text-align:left">Token</label>
      <input type="text" id="inputToken" placeholder="4d5d6932..." autocomplete="off" spellcheck="false">
      <button id="btnGuardar">Entrar</button>
      <div class="errorCfg" id="errorCfg"></div>
      <button id="btnOlvidar">Olvidar datos guardados en este navegador</button>
    </div>
  </div>

  <!-- Loader -->
  <div id="loading" style="display:none">
    <div class="spinner"></div>
    <div class="logo" style="font-size:20px">Panel <em>Escolar</em></div>
    <div class="sub">Abriendo panel...</div>
  </div>

  <!-- Panel real -->
  <iframe id="marco" allow="clipboard-write; clipboard-read" title="Panel Escolar"></iframe>
  <button id="btnSalir">Salir</button>

  <script>
    var CLAVE_ID = 'panel_escolar_id';
    var CLAVE_TOKEN = 'panel_escolar_token';

    function construirUrl(id, token) {
      return 'https://script.google.com/macros/s/' + id + '/exec?token=' + token;
    }

    function mostrarPanel(url) {
      document.getElementById('config').style.display = 'none';
      document.getElementById('loading').style.display = 'flex';
      document.getElementById('btnSalir').style.display = 'block';
      var marco = document.getElementById('marco');
      marco.src = url;
      marco.style.display = 'block';
      marco.addEventListener('load', function () {
        var loading = document.getElementById('loading');
        loading.classList.add('hide');
        setTimeout(function () { loading.style.display = 'none'; }, 300);
      });
      // Respaldo: si 'load' nunca dispara, quitar el loader igual tras 8s
      setTimeout(function () {
        var loading = document.getElementById('loading');
        if (loading && loading.style.display !== 'none') {
          loading.classList.add('hide');
          setTimeout(function () { loading.style.display = 'none'; }, 300);
        }
      }, 8000);
    }

    function mostrarConfig() {
      document.getElementById('config').style.display = 'flex';
    }

    function intentarEntrar() {
      var id = document.getElementById('inputId').value.trim();
      var token = document.getElementById('inputToken').value.trim();
      var err = document.getElementById('errorCfg');
      err.textContent = '';
      if (!id) { err.textContent = 'Falta el ID de implementacion'; return; }
      if (!token) { err.textContent = 'Falta el token'; return; }
      // Limpiar espacios accidentales al pegar
      id = id.replace(/\s/g,'');
      token = token.replace(/\s/g,'');
      localStorage.setItem(CLAVE_ID, id);
      localStorage.setItem(CLAVE_TOKEN, token);
      mostrarPanel(construirUrl(id, token));
    }

    document.getElementById('btnGuardar').addEventListener('click', intentarEntrar);
    document.getElementById('inputId').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') document.getElementById('inputToken').focus();
    });
    document.getElementById('inputToken').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') intentarEntrar();
    });
    document.getElementById('btnOlvidar').addEventListener('click', function () {
      localStorage.removeItem(CLAVE_ID);
      localStorage.removeItem(CLAVE_TOKEN);
      location.reload();
    });

    document.getElementById('btnSalir').addEventListener('click', function () {
      var idGuardado = localStorage.getItem(CLAVE_ID);
      var tokenGuardado = localStorage.getItem(CLAVE_TOKEN);
      localStorage.removeItem(CLAVE_ID);
      localStorage.removeItem(CLAVE_TOKEN);
      if (idGuardado && tokenGuardado) {
        // Avisar al servidor que revoque la sesion (todas las sesiones de esta persona)
        var urlCierre = construirUrl(idGuardado, tokenGuardado) + '&cerrar=1';
        var marco = document.getElementById('marco');
        marco.src = urlCierre;
      }
      setTimeout(function () { location.reload(); }, 600);
    });

    // Al cargar: si ya hay datos guardados en ESTE navegador, entrar directo
    var idGuardadoInicio = localStorage.getItem(CLAVE_ID);
    var tokenGuardadoInicio = localStorage.getItem(CLAVE_TOKEN);
    if (idGuardadoInicio && tokenGuardadoInicio) {
      mostrarPanel(construirUrl(idGuardadoInicio, tokenGuardadoInicio));
    } else {
      mostrarConfig();
    }
  </script>

</body>
</html>
