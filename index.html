<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="theme-color" content="#1C1917">
<meta name="mobile-web-app-capable" content="yes">
<title>Panel Escolar</title>
<meta name="robots" content="noindex, nofollow">
<!-- Solucion al 404 de favicon -->
<link rel="icon" href="data:,">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:#1C1917;
    color:#fff;
    overflow:hidden;
  }

  /* Pantalla de configuracion (primera vez en este navegador) */
  #config {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:24px; z-index:3;
    background:radial-gradient(circle at 50% 0%,#2a2622 0%,#1C1917 60%);
  }
  .logo {
    font-family:Georgia,'Times New Roman',serif; font-style:italic;
    font-weight:300; font-size:26px; letter-spacing:-.3px; text-align:center;
  }
  .logo em { font-style:italic; color:#D4A853; }
  .caja {
    background:#252220; border-radius:20px; padding:32px 28px;
    max-width:360px; width:100%; margin-top:22px;
    box-shadow:0 20px 50px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.04);
    animation:aparecerCfg .35s ease;
  }
  @keyframes aparecerCfg{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .caja p {
    font-size:12.5px; color:#A8A29E; line-height:1.65; margin-bottom:24px;
  }
  .campoLabel {
    display:block; font-size:11px; color:#8f897f; margin-bottom:8px;
    letter-spacing:.4px; font-weight:600; text-transform:uppercase;
  }
  .inputCfg {
    width:100%; padding:14px; border-radius:12px; border:1.5px solid #3a3632;
    background:#181614; color:#fff; font-size:13px; margin-bottom:18px;
    font-family:'DM Mono',monospace; transition:border-color .15s;
  }
  .inputCfg:focus { outline:none; border-color:#D4A853; }
  .inputCfg::placeholder { color:#454039; font-style:italic; }
  #btnGuardar {
    width:100%; padding:14px; border:none; border-radius:12px;
    background:linear-gradient(180deg,#DFB865,#D4A853); color:#1C1917;
    font-weight:700; font-size:14px; cursor:pointer;
    box-shadow:0 4px 14px rgba(212,168,83,.25); transition:transform .1s,box-shadow .15s;
  }
  #btnGuardar:active { transform:translateY(1px); box-shadow:0 2px 8px rgba(212,168,83,.2); }
  .errorCfg { color:#E8614A; font-size:12px; text-align:center; min-height:16px; margin-top:12px; font-weight:500; }
  #btnOlvidar {
    display:block; margin:20px auto 0; background:none; border:none;
    color:#5a554e; font-size:11px; cursor:pointer; text-decoration:underline;
  }

  /* Loader mientras carga el iframe */
  #loading {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px;
    background:#1C1917; z-index:2; transition:opacity .3s ease;
  }
  #loading.hide { opacity:0; pointer-events:none; }
  #loading .sub { font-size:12px; color:#A8A29E; letter-spacing:.4px; }
  .spinner {
    width:26px; height:26px; border-radius:50%;
    border:2.5px solid #3a3632; border-top-color:#D4A853;
    animation:spin .8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  #barraSuperior {
    position:fixed; top:0; left:0; right:0; height:34px; z-index:5;
    background:#161412; border-bottom:1px solid #2a2622;
    display:none; align-items:center; justify-content:flex-end; padding:0 12px;
  }
  #btnSalir {
    background:none; border:none; color:#8f897f; font-size:11px;
    cursor:pointer; padding:6px 8px;
  }
  #btnSalir:active { opacity:.6; }
  iframe {
    position:fixed; left:0; right:0; bottom:0; top:0; width:100%;
    border:none; display:none; z-index:1;
  }
  iframe.conBarra { top:34px; height:calc(100% - 34px); }
</style>
</head>
<body>

  <!-- Pantalla de configuracion: solo aparece si este navegador no tiene nada guardado -->
  <div id="config" style="display:none">
    <div class="logo">Panel <em>Escolar</em></div>
    <div class="caja">
      <p>
        Ingresa tus dos datos de acceso (llegan por correo). Esta pagina
        NUNCA los guarda ni transmite a ningun servidor propio — solo
        quedan en la memoria de ESTE navegador, en este dispositivo.
      </p>
      <label class="campoLabel" for="inputId">ID de implementacion</label>
      <input class="inputCfg" type="text" id="inputId" placeholder="Pega aqui el ID (ej: AKfycb...)" autocomplete="off" spellcheck="false" oninput="document.getElementById('contadorId').textContent=this.value.trim().length+' caracteres'">
      <div style="font-size:10px;color:#454039;margin:-12px 0 6px" id="contadorId"></div>
      <label class="campoLabel" for="inputToken">Token</label>
      <input class="inputCfg" type="text" id="inputToken" placeholder="Pega aqui tu token personal" autocomplete="off" spellcheck="false" oninput="document.getElementById('contadorToken').textContent=this.value.trim().length+' caracteres'">
      <div style="font-size:10px;color:#454039;margin:-12px 0 18px" id="contadorToken"></div>
      <button id="btnGuardar">Entrar</button>
      <div class="errorCfg" id="errorCfg"></div>
      <button id="btnOlvidar">Olvidar datos guardados en este navegador</button>
    </div>
  </div>

  <!-- Loader -->
  <div id="loading" style="display:none">
    <div class="spinner"></div>
    <div class="logo" style="font-size:20px">Panel <em>Escolar</em></div>
    <div class="sub">Abriendo panel...</div>
  </div>

  <!-- Panel real -->
  <div id="barraSuperior">
    <button id="btnSalir">Salir</button>
  </div>
  <iframe id="marco" allow="clipboard-write; clipboard-read" title="Panel Escolar"></iframe>

  <script>
    var CLAVE_ID = 'panel_escolar_id';
    var CLAVE_TOKEN = 'panel_escolar_token';
    var CLAVE_SESION = 'panel_escolar_sesion';

    function construirUrl(id, token) {
      var url = 'https://script.google.com/macros/s/' + id + '/exec?token=' + token;
      var sesionGuardada = localStorage.getItem(CLAVE_SESION);
      if (sesionGuardada) url += '&sesion=' + sesionGuardada;
      return url;
    }

    // Escuchar avisos del iframe (dominio de Google) cuando se crea una sesion
    // nueva tras PIN+TOTP. Su localStorage es una caja separada del nuestro,
    // por eso no podemos leerlo directo - postMessage es el puente entre dominios.
    window.addEventListener('message', function(evento) {
      if (evento && evento.data && evento.data.tipo === 'panel_sesion' && evento.data.sesion) {
        if (evento.data.recordar) {
          localStorage.setItem(CLAVE_SESION, evento.data.sesion);
        }
        // Si no marco "recordar", no guardamos nada - la sesion corta (4h) sigue
        // viva del lado del servidor, pero no queremos que sobreviva a cerrar
        // la app en un dispositivo que dijo explicitamente que no es personal.
      }
    });

    function mostrarPanel(url) {
      document.getElementById('config').style.display = 'none';
      document.getElementById('loading').style.display = 'flex';
      document.getElementById('barraSuperior').style.display = 'flex';
      var marco = document.getElementById('marco');
      marco.classList.add('conBarra');
      marco.src = url;
      marco.style.display = 'block';
      marco.addEventListener('load', function () {
        var loading = document.getElementById('loading');
        loading.classList.add('hide');
        setTimeout(function () { loading.style.display = 'none'; }, 300);
      });
      // Respaldo: si 'load' nunca dispara, quitar el loader igual tras 8s
      setTimeout(function () {
        var loading = document.getElementById('loading');
        if (loading && loading.style.display !== 'none') {
          loading.classList.add('hide');
          setTimeout(function () { loading.style.display = 'none'; }, 300);
        }
      }, 8000);
    }

    function mostrarConfig() {
      document.getElementById('config').style.display = 'flex';
    }

    function intentarEntrar() {
      var id = document.getElementById('inputId').value.trim();
      var token = document.getElementById('inputToken').value.trim();
      var err = document.getElementById('errorCfg');
      err.textContent = '';
      if (!id) { err.textContent = 'Falta el ID de implementacion'; return; }
      if (!token) { err.textContent = 'Falta el token'; return; }
      // Limpiar espacios accidentales al pegar
      id = id.replace(/\s/g,'');
      token = token.replace(/\s/g,'');
      localStorage.setItem(CLAVE_ID, id);
      localStorage.setItem(CLAVE_TOKEN, token);
      mostrarPanel(construirUrl(id, token));
    }

    // Vuelve al estado inicial (pantalla de ID+Token) sin depender de recargar la pagina
    function resetearAConfig() {
      var marco = document.getElementById('marco');
      marco.src = 'about:blank';
      marco.style.display = 'none';
      marco.classList.remove('conBarra');
      document.getElementById('barraSuperior').style.display = 'none';
      document.getElementById('loading').style.display = 'none';
      document.getElementById('inputId').value = '';
      document.getElementById('inputToken').value = '';
      document.getElementById('errorCfg').textContent = '';
      mostrarConfig();
    }

    document.getElementById('btnGuardar').addEventListener('click', intentarEntrar);
    document.getElementById('inputId').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') document.getElementById('inputToken').focus();
    });
    document.getElementById('inputToken').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') intentarEntrar();
    });
    document.getElementById('btnOlvidar').addEventListener('click', function () {
      localStorage.removeItem(CLAVE_ID);
      localStorage.removeItem(CLAVE_TOKEN);
      localStorage.removeItem(CLAVE_SESION);
      resetearAConfig();
    });

    // SALIR: solo cierra la sesion de ESTE dispositivo. Guarda ID y token para
// no tener que volver a pegarlos - la proxima vez solo pide PIN+codigo de nuevo.
document.getElementById('btnSalir').addEventListener('click', function () {
      localStorage.removeItem(CLAVE_SESION);
      var idGuardado = localStorage.getItem(CLAVE_ID);
      var tokenGuardado = localStorage.getItem(CLAVE_TOKEN);
      if (idGuardado && tokenGuardado) {
        // Recargar con el ID+token (sin sesion, ya la borramos) - vuelve a la pantalla de PIN directo
        mostrarPanel(construirUrl(idGuardado, tokenGuardado));
      } else {
        resetearAConfig();
      }
    });

// OLVIDAR DISPOSITIVO: llega desde el link dentro de la pantalla de login
// (la IA del otro lado del iframe no puede tocar nuestro localStorage directo -
// por eso usa postMessage para avisarnos, y aca borramos todo de verdad).
window.addEventListener('message', function (evento) {
  if (evento && evento.data && evento.data.tipo === 'olvidar_dispositivo') {
    localStorage.removeItem(CLAVE_ID);
    localStorage.removeItem(CLAVE_TOKEN);
    localStorage.removeItem(CLAVE_SESION);
    setTimeout(resetearAConfig, 1200); // dar tiempo a que se vea el mensaje de confirmacion primero
  }
});

    // Al cargar: si ya hay datos guardados en ESTE navegador, entrar directo
    var idGuardadoInicio = localStorage.getItem(CLAVE_ID);
    var tokenGuardadoInicio = localStorage.getItem(CLAVE_TOKEN);
    if (idGuardadoInicio && tokenGuardadoInicio) {
      mostrarPanel(construirUrl(idGuardadoInicio, tokenGuardadoInicio));
    } else {
      mostrarConfig();
    }
  </script>

</body>
</html>
