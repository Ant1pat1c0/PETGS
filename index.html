<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="theme-color" content="#1C1917">
    <meta name="mobile-web-app-capable" content="yes">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Escolar Greenland</title>
    <!-- Solución al error 404 (falta de favicon) -->
    <link rel="icon" href="data:,">
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1C1917;
            color: #fff;
            /* Fuentes de sistema para evitar el bloqueo de seguridad (CSP) de Apps Script */
            font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        #loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1;
            background: #1C1917;
            transition: opacity 0.3s ease;
        }
        .logo {
            font-family: Georgia, 'Times New Roman', serif;
            font-style: italic;
            font-weight: 300;
            font-size: 22px;
            color: #fff;
            letter-spacing: -.3px;
            margin-bottom: 18px;
        }
        .logo em {
            font-style: italic;
            color: #D4A853;
        }
        .spinner {
            width: 26px;
            height: 26px;
            border: 2.5px solid #3a3632;
            border-top-color: #D4A853;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 14px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        p {
            color: #A8A29E;
            font-size: 12px;
            letter-spacing: .3px;
            margin: 0;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
        }
    </style>
</head>
<body>
    <!-- Pantalla de carga con el estilo del panel -->
    <div id="loader">
        <div class="logo">Panel <em>Escolar</em></div>
        <div class="spinner"></div>
        <p>Abriendo panel...</p>
    </div>
    <!-- Contenedor de la app -->
    <iframe id="app-frame" allow="autoplay; clipboard-write; clipboard-read" title="Panel Escolar Greenland"></iframe>
    <script>
        // URL base de Apps Script para Panel Escolar Greenland
        var URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbwSLAqgZDRNWvOlEyh8Wk_cpk2N6qkenCC6BsfW2L2pjCP-wB96_ND0ObAd8DcsObLP/exec";

        // Captura los parámetros que vienen en la barra de direcciones
        var queryParams = window.location.search;

        // Asigna la URL completa con parámetros al src del iframe
        var iframe = document.getElementById("app-frame");
        iframe.src = URL_APPS_SCRIPT + queryParams;

        // Oculta el loader cuando el iframe termine de cargar
        iframe.onload = function() {
            var loader = document.getElementById("loader");
            if (loader) {
                loader.style.opacity = "0";
                setTimeout(function() {
                    loader.style.display = "none";
                }, 300);
            }
        };

        // Respaldo: si por algún motivo 'load' no dispara (red lenta, bloqueo),
        // quitar el loader igual tras 8s para no dejar a la persona esperando indefinidamente
        setTimeout(function() {
            var loader = document.getElementById("loader");
            if (loader && loader.style.display !== "none") {
                loader.style.opacity = "0";
                setTimeout(function() { loader.style.display = "none"; }, 300);
            }
        }, 8000);
    </script>
</body>
</html>
